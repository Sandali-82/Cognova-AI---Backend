name: Keepalive

on:
  schedule:
    # Every 3 days at 03:00 UTC (Supabase pauses after 7 days of inactivity)
    - cron: "0 3 */3 * *"
  workflow_dispatch: {}  # allows manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          # The Render free instance may need up to a minute to wake up,
          # so allow a long timeout and a few retries.
          curl --fail --silent --show-error \
            --max-time 120 --retry 3 --retry-delay 30 --retry-all-errors \
            https://cognova-ai-backend.onrender.com/api/health/